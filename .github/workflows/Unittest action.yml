name: Unittest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Run unittest
        run: python -m unittest tests.test_unittest -v

      - name: Summary
        if: success()
        run: echo "### ✅ All unittest checks passed" >> "$GITHUB_STEP_SUMMARY"
